name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Tests (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-latest
            gradle: ./gradlew
          - name: Windows
            os: windows-latest
            gradle: .\gradlew.bat
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v4
      - run: ${{ matrix.gradle }} test --console=plain

  native-image:
    name: Native image (${{ matrix.name }})
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-latest
            gradle: ./gradlew
            artifact: optraix-linux-x86_64
            executable: optraix
          - name: Windows
            os: windows-latest
            gradle: .\gradlew.bat
            artifact: optraix-windows-x86_64
            executable: optraix.exe
    steps:
      - uses: actions/checkout@v4
      - uses: graalvm/setup-graalvm@v1
        with:
          distribution: graalvm-community
          java-version: "25"
          github-token: ${{ secrets.GITHUB_TOKEN }}
          native-image-job-reports: "true"
      - uses: gradle/actions/setup-gradle@v4
      - run: ${{ matrix.gradle }} nativeCompile --console=plain
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: build/native/nativeCompile/${{ matrix.executable }}
          if-no-files-found: error
